# Infigo drop-in for shairport-sync: use the Infigo config file and pin the
# process to the isolated audio core (highest CPU: 3 on quad, 7 on octa).
[Service]
ExecStart=
ExecStart=/usr/bin/sh -c 'exec /usr/bin/taskset -c $$(($$(/usr/bin/getconf _NPROCESSORS_CONF) - 1)) /usr/bin/shairport-sync --log-to-syslog -c /etc/infigo/shairport-sync.conf'
